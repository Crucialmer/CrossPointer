name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Setup MSVC
        uses: step-security/msvc-dev-cmd@v1

      - name: Build CrossPointer (Release /MT)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 8

      - name: Create Flat ZIP Package
        shell: pwsh
        run: |
          $stagingDir = "staging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          Copy-Item "CrossPointer.exe" -Destination "$stagingDir\CrossPointer.exe"
          Copy-Item "README.md" -Destination "$stagingDir\README.md"
          if (Test-Path "QuickStart_Guide.txt") {
            Copy-Item "QuickStart_Guide.txt" -Destination "$stagingDir\QuickStart_Guide.txt"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $stagingDir,
            "CrossPointer.zip",
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false,
            [System.Text.Encoding]::UTF8
          )

      - name: Upload Artifact Zip
        uses: actions/upload-artifact@v4
        with:
          name: CrossPointer
          path: .\CrossPointer.zip
